<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20" width="30" height="20">
  <!-- Uchta band: ko'k / oq / yashil, orasida ingichka qizil chiziqlar -->
  <rect width="30" height="20" fill="#fff"/>
  <rect width="30" height="6.4" y="0"    fill="#0099b5"/>
  <rect width="30" height="6.4" y="13.6" fill="#1eb53a"/>
  <rect width="30" height="0.5" y="6.4"  fill="#ce1126"/>
  <rect width="30" height="0.5" y="13.1" fill="#ce1126"/>
  <!-- Yarim oy (oq) -->
  <circle cx="5.2" cy="3.4" r="2.1" fill="#fff"/>
  <circle cx="6.1" cy="3.4" r="1.9" fill="#0099b5"/>
  <!-- Bir nechta yulduz (soddalashtirilgan) -->
  <circle cx="8.6"  cy="2.2" r="0.35" fill="#fff"/>
  <circle cx="10.2" cy="2.2" r="0.35" fill="#fff"/>
  <circle cx="8.6"  cy="3.8" r="0.35" fill="#fff"/>
  <circle cx="10.2" cy="3.8" r="0.35" fill="#fff"/>
  <circle cx="11.8" cy="3.8" r="0.35" fill="#fff"/>
</svg>
